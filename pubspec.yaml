name: farmsmart_flutter
description: Farmsmart Flutter app

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.1.1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.20.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.0
  image_cropper: ^8.0.0

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.0
  country_codes: ^3.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.0
  shared_preferences: ^2.2.0
  flutter_html: ^3.0.0 
  flutter_launcher_icons: ^0.13.0

  webview_flutter: ^4.0.0
  share_plus: ^10.0.0
  package_info_plus: ^9.0.0
  cached_network_image: ^3.2.0
  url_launcher: ^6.0.0
  decimal: ^2.0.0
  firebase_core: ^2.13.0
  firebase_analytics: ^10.4.0
  cloud_firestore: ^4.11.0
  firebase_auth: ^4.17.8
  firebase_storage: ^11.6.0

  provider: ^6.0.0


  flutter_cache_manager: any
  path: any
  path_provider: any
dev_dependencies:
  test: ^1.15.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  json_serializable: ^6.0.0
  mockito: ^5.3.0


# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/icons/chatbot_avatar.png
    - assets/icons/app_icon.png
    - assets/icons/community_selected.png
    - assets/icons/community.png
    - assets/icons/discover_selected.png
    - assets/icons/discover.png
    - assets/icons/my_plot_selected.png
    - assets/icons/my_plot.png
    - assets/icons/profit_loss_selected.png
    - assets/icons/profit_loss.png
    - assets/icons/detail_icon_date.png
    - assets/icons/detail_icon_description.png
    - assets/privacy_policy.html
    - assets/icons/profit_add.png
    - assets/icons/tick_large.png
    - assets/icons/detail_icon_companion.png
    - assets/icons/detail_icon_complexity.png
    - assets/icons/detail_icon_crop_type.png
    - assets/icons/detail_icon_non_companion.png
    - assets/icons/detail_icon_profitability.png
    - assets/icons/detail_icon_setup_costs.png
    - assets/icons/detail_icon_water.png
    - assets/privacy_policy.html
    - assets/icons/flag_kenya.png
    - assets/icons/flag_usa.png
    - assets/icons/detail_icon_sale.png
    - assets/icons/detail_icon_cost.png
    - assets/icons/radio_button_default.png
    - assets/icons/radio_button_active.png
    - assets/icons/chevron.png
    - assets/icons/detail_icon_best_soil.png
    - assets/icons/detail_icon_invite.png
    - assets/icons/detail_icon_language.png
    - assets/icons/detail_icon_new_profile.png
    - assets/icons/detail_icon_pin.png
    - assets/raw/
    - assets/icons/
    - assets/icons/nav_icon_back.png
    - assets/icons/nav_icon_options.png
    - assets/icons/nav_icon_cancel.png
    - assets/responses/create_account_mock_form.json
    - assets/responses/farmsmart_chat_ui_flow.json
    - assets/responses/farmsmart_chat_ui_flow_sw.json
    - assets/responses/farmsmart_chat_ui_flow_fr.json
    - assets/responses/farmsmart_chat_ui_flow_ty.json
    

  fonts:
  - family: IBMPlexSans
    fonts:
      - asset: assets/fonts/IBMPlexSans-Bold.ttf
      - asset: assets/fonts/IBMPlexSans-Medium.ttf
      - asset: assets/fonts/IBMPlexSans-Regular.ttf


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon_v2.png"

  # To update the app icon check https://pub.dartlang.org/packages/flutter_launcher_icons

  # To add assets to your application, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
